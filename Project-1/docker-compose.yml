version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oracledocu-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8000
      - OCI_CONFIG_FILE=/root/.oci/config
      - OCI_COMPARTMENT_ID=${OCI_COMPARTMENT_ID}
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
      - ORACLE_DB_DSN=${ORACLE_DB_DSN}
    volumes:
      - ~/.oci:/root/.oci:ro
      - ./oracle_wallet:/app/oracle_wallet:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oracledocu-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
