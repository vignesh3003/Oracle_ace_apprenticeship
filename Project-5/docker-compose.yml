version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: mediastream-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8000
      - OCI_CONFIG_FILE=/root/.oci/config
      - OCI_COMPARTMENT_ID=${OCI_COMPARTMENT_ID}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
      - ORACLE_DB_DSN=${ORACLE_DB_DSN}
    volumes:
      - ~/.oci:/root/.oci:ro

  dashboard:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile
    container_name: mediastream-dashboard
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
